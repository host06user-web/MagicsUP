<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Fight 2P</title>
    <style>
        * { box-sizing: border-box; margin:0; padding:0; user-select:none; -webkit-user-select:none; }
        body { background:#05050a; color:#fff; font-family:monospace; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
        #gameContainer { position:relative; width:100%; max-width:800px; aspect-ratio:16/9; background:#000; border:3px solid #00f0ff; box-shadow:0 0 15px #00f0ff; border-radius:8px; }
        canvas { width:100%; height:100%; display:block; }
        .hud { position:absolute; top:12px; left:0; width:100%; display:flex; justify-content:space-between; align-items:center; padding:0 20px; font-weight:bold; font-size:16px; }
        .bar-bg { width:35%; background:rgba(255,255,255,0.1); height:16px; border:2px solid #fff; border-radius:4px; overflow:hidden; position:relative; }
        .bar { height:100%; width:100%; transition:width 0.1s; }
        .sp-bar { height:4px; width:0%; background:#ffaa00; position:absolute; bottom:0; left:0; transition:width 0.1s; }
        #p1H { background:linear-gradient(90deg, #ff0055, #ff5500); }
        #p2H { background:linear-gradient(270deg, #00ff66, #00ffff); }
        #timer { background:#111; padding:2px 8px; border:2px solid #ff0055; border-radius:6px; color:#ff0055; font-size:18px; }
        #over { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); flex-direction:column; align-items:center; justify-content:center; z-index:10; }
        #winTxt { font-size:32px; font-weight:bold; margin-bottom:8px; }
        
        /* Controles Divididos: P1 na Esquerda, P2 na Direita */
        #ctrls { position:absolute; bottom:0; left:0; width:100%; height:110px; display:flex; justify-content:space-between; padding:10px 20px; pointer-events:none; }
        .pad { display:flex; gap:10px; pointer-events:auto; align-items:center; }
        .btn { width:48px; height:48px; background:rgba(26,26,51,0.8); border:2px solid #336; border-radius:50%; color:#00f0ff; font-size:18px; display:flex; align-items:center; justify-content:center; }
        .btn:active { background:#336; color:#fff; }
        .atk-b { width:52px; height:52px; border-radius:8px; font-size:20px; }
        .b-atk { border-color:#ff0055; color:#ff0055; }
        .b-sp { border-color:#ffaa00; color:#ffaa00; }
    </style>
</head>
<body>
<div id="gameContainer">
    <div class="hud">
        <div class="bar-bg"><div id="p1H" class="bar"></div><div id="p1S" class="sp-bar"></div></div>
        <div id="timer">60</div>
        <div class="bar-bg"><div id="p2H" class="bar"></div><div id="p2S" class="sp-bar"></div></div>
    </div>
    <div id="over"><div id="winTxt"></div><div style="color:#888">Próxima rodada...</div></div>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ctrls">
        <!-- Lado do Player 1 (Esquerda) -->
        <div class="pad">
            <div class="btn" id="p1L">◀</div>
            <div class="btn" id="p1R">▶</div>
            <div class="btn" id="p1J">▲</div>
            <div class="btn atk-b b-atk" id="p1A">👊</div>
            <div class="btn atk-b b-sp" id="p1E">🔥</div>
        </div>
        <!-- Lado do Player 2 (Direita) -->
        <div class="pad">
            <div class="btn atk-b b-sp" id="p2E">🔥</div>
            <div class="btn atk-b b-atk" id="p2A">👊</div>
            <div class="btn" id="p2J">▲</div>
            <div class="btn" id="p2L">◀</div>
            <div class="btn" id="p2R">▶</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = 1024; canvas.height = 576;
const gravity = 0.6;
let gameActive = true;

class Fighter {
    constructor({ x, color, ox, id }) {
        this.pos = { x, y: 0 }; this.vel = { x: 0, y: 0 };
        this.w = 60; this.h = 140; this.color = color; this.id = id;
        this.isAtk = false; this.isSp = false; this.hp = 100; this.sp = 0;
        this.state = 'idle'; this.facing = id === 1 ? 'right' : 'left'; this.stTimer = 0;
        this.combo = 0; this.comboTimer = 0;
        this.atkBox = { pos: { x: 0, y: 0 }, ox, w: 90, h: 45 };
    }
    draw() {
        ctx.save();
        ctx.shadowBlur = 12; ctx.shadowColor = this.color;
        let g = ctx.createLinearGradient(this.pos.x, this.pos.y, this.pos.x, this.pos.y + this.h);
        g.addColorStop(0, this.color); g.addColorStop(1, '#000');
        ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(this.pos.x, this.pos.y, this.w, this.h, 6); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.shadowBlur = 0;
        
        // Expressões com Emoticons Nativos (Super leves e sem perder qualidade)
        ctx.fillStyle = '#fff'; ctx.font = 'bold 16px monospace';
        let fx = this.pos.x + (this.facing === 'right' ? 14 : 10), fy = this.pos.y + 30;
        let face = "•_•";
        if (this.state === 'hit') face = "✕_✕";
        else if (this.state === 'atk') face = "🪓_🪓";
        else if (this.state === 'sp') face = "🔥_🔥";
        else if (Math.floor(Date.now() / 250) % 6 === 0) face = "–_–";
        ctx.fillText(face, fx, fy);

        // Texto de Hits do Combo acima da cabeça
        if (this.combo > 1 && this.comboTimer > 0) {
            ctx.fillStyle = '#ffaa00'; ctx.font = 'italic bold 18px monospace';
            ctx.fillText(`${this.combo} HITS!`, this.pos.x - 5, this.pos.y - 15);
        }

        if (this.isAtk) { ctx.fillStyle = this.isSp ? 'rgba(255,150,0,0.4)' : 'rgba(255,255,0,0.25)'; ctx.fillRect(this.atkBox.pos.x, this.atkBox.pos.y, this.atkBox.w, this.atkBox.h); }
        ctx.restore();
    }
    update() {
        this.draw();
        this.atkBox.pos.x = this.facing === 'right' ? this.pos.x + this.atkBox.ox : this.pos.x - this.atkBox.w + 10;
        this.atkBox.pos.y = this.pos.y + 25;
        if (this.stTimer > 0) { this.stTimer--; if (this.stTimer === 0) { this.state = 'idle'; this.isSp = false; } }
        if (this.comboTimer > 0) { this.comboTimer--; if (this.comboTimer === 0) this.combo = 0; }
        this.pos.x += this.vel.x; this.pos.y += this.vel.y;
        if (this.pos.y + this.h + this.vel.y >= canvas.height - 85) { this.vel.y = 0; this.pos.y = canvas.height - 85 - this.h; }
        else { this.vel.y += gravity; }
        this.pos.x = Math.max(0, Math.min(canvas.width - this.w, this.pos.x));
    }
    attack(special = false) {
        if (this.isAtk || this.state === 'hit') return;
        if (special) {
            if (this.sp < 100) return;
            this.sp = 0; this.isSp = true; this.state = 'sp'; this.atkBox.w = 160;
        } else {
            this.state = 'atk'; this.atkBox.w = 90;
        }
        this.isAtk = true; this.stTimer = special ? 25 : 12;
        document.getElementById(`p${this.id}S`).style.width = this.sp + '%';
        setTimeout(() => { this.isAtk = false; }, special ? 250 : 120);
    }
    damage(amt) {
        this.hp = Math.max(0, this.hp - amt); this.state = 'hit'; this.stTimer = 14;
        this.sp = Math.min(100, this.sp + 8);
        document.getElementById(`p${this.id}S`).style.width = this.sp + '%';
    }
    addCombo() { this.combo++; this.comboTimer = 60; this.sp = Math.min(100, this.sp + 12); document.getElementById(`p${this.id}S`).style.width = this.sp + '%'; }
}

const p1 = new Fighter({ x: 200, color: '#ff0055', ox: 50, id: 1 });
const p2 = new Fighter({ x: 750, color: '#00ff66', ox: 50, id: 2 });
const input = { p1L: false, p1R: false, p2L: false, p2R: false };

function bind(id, s, e) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (x) => { x.preventDefault(); s(); });
    el.addEventListener('touchend', (x) => { x.preventDefault(); e(); });
    el.addEventListener('mousedown', s); el.addEventListener('mouseup', e);
}
// Vinculando Botões Virtuais do Tablet P1
bind('p1L', () => input.p1L = true, () => input.p1L = false);
bind('p1R', () => input.p1R = true, () => input.p1R = false);
bind('p1J', () => { if (p1.vel.y === 0 && gameActive) p1.vel.y = -14; }, () => {});
bind('p1A', () => { if (gameActive) p1.attack(false); }, () => {});
bind('p1E', () => { if (gameActive) p1.attack(true); }, () => {});

// Vinculando Botões Virtuais do Tablet P2
bind('p2L', () => input.p2L = true, () => input.p2L = false);
bind('p2R', () => input.p2R = true, () => input.p2R = false);
bind('p2J', () => { if (p2.vel.y === 0 && gameActive) p2.vel.y = -14; }, () => {});
bind('p2A', () => { if (gameActive) p2.attack(false); }, () => {});
bind('p2E', () => { if (gameActive) p2.attack(true); }, () => {});

function checkCol(r1, r2) {
    return (r1.atkBox.pos.x + r1.atkBox.w >= r2.pos.x && r1.atkBox.pos.x <= r2.pos.x + r2.w && r1.atkBox.pos.y + r1.atkBox.h >= r2.pos.y && r1.atkBox.pos.y <= r2.pos.y + r2.h);
}

let t = 60; const tEl = document.getElementById('timer');
const clock = setInterval(() => { if (t > 0 && gameActive) { t--; tEl.innerText = t; } else if (gameActive) end(); }, 1000);

function end() {
    gameActive = false; clearInterval(clock);
    const o = document.getElementById('over'), w = document.getElementById('winTxt');
    if (p1.hp === p2.hp) { w.innerText = "EMPATE!"; w.style.color = "#ffa800"; }
    else if (p1.hp > p2.hp) { w.innerText = "PLAYER 1 VENCEU!"; w.style.color = "#ff0055"; }
    else { w.innerText = "PLAYER 2 VENCEU!"; w.style.color = "#00ff66"; }
    o.style.display = 'flex'; setTimeout(() => window.location.reload(), 3000);
}

function loop() {
    window.requestAnimationFrame(loop);
    ctx.fillStyle = '#05050b'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(0,240,255,0.04)'; ctx.lineWidth = 1;
    p1.update(); p2.update();
    p1.vel.x = p2.vel.x = 0;
    if (gameActive) {
        p1.facing = p1.pos.x < p2.pos.x ? 'right' : 'left';
        p2.facing = p2.pos.x < p1.pos.x ? 'right' : 'left';
        if (p1.state !== 'hit') { if (input.p1L) p1.vel.x = -5; else if (input.p1R) p1.vel.x = 5; }
        if (p2.state !== 'hit') { if (input.p2L) p2.vel.x = -5; else if (input.p2R) p2.vel.x = 5; }
    }
    if (checkCol(p1, p2) && p1.isAtk) {
        let dmg = p1.isSp ? 15 : 4; p2.damage(dmg); p1.addCombo();
        document.getElementById('p2H').style.width = p2.hp + '%'; p1.isAtk = false;
    }
    if (checkCol(p2, p1) && p2.isAtk) {
        let dmg = p2.isSp ? 15 : 4; p1.damage(dmg); p2.addCombo();
        document.getElementById('p1H').style.width = p1.hp + '%'; p2.isAtk = false;
    }
    if (gameActive && (p1.hp <= 0 || p2.hp <= 0)) end();
}
loop();
</script>
</body>
</html>
