<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magic Cards: Base Defense Epic</title>
<style>
body{margin:0;background:#0d0e12;color:#fff;font-family:Arial;height:100vh;display:flex;flex-direction:column}
#menu,#gameover{position:fixed;inset:0;background:#111;display:flex;flex-direction:column;justify-content:center;align-items:center}
#game{display:none;flex:1;flex-direction:column}
#hud{display:flex;justify-content:space-around;padding:10px;background:#1a1c23}
#battle{flex:1;position:relative;background:#222;overflow:hidden}
.base,.unit{position:absolute;bottom:20px}
.base{width:60px;height:100px}
#pbase{left:10px;background:#3a86ff}
#ebase{right:10px;background:#ff0054}
#hero{left:90px;width:40px;height:60px;background:#fff;color:#000;text-align:center;line-height:60px}
.enemy{width:40px;height:60px;background:#ff0054;text-align:center;line-height:60px}
.ally{width:40px;height:60px;background:#3a86ff;text-align:center;line-height:60px}
#controls{padding:10px;background:#1a1c23;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{padding:12px;border:none;border-radius:8px}
</style>
</head>
<body>

<div id="menu">
<h1>Magic Cards: Base Defense</h1>
<button onclick="startGame()">JOGAR</button>
</div>

<div id="gameover" style="display:none">
<h1>Game Over</h1>
<p id="final"></p>
<button onclick="location.reload()">Reiniciar</button>
</div>

<div id="game">
<div id="hud">
<div>Fase: <span id="stage">1</span></div>
<div>Ouro: <span id="gold">0</span></div>
<div>Mana: <span id="mana">10</span></div>
<div>Base: <span id="hp">100</span></div>
</div>

<div id="battle">
<div id="pbase" class="base"></div>
<div id="ebase" class="base"></div>
<div id="hero" class="unit">👑</div>
</div>

<div id="controls">
<button onclick="move(-25)">⬅</button>
<button onclick="move(25)">➡</button>
<button onclick="attack()">⚔</button>
<button onclick="summon()">🧙</button>
</div>
</div>

<script>
const S={stage:1,gold:0,mana:10,hp:100,hero:90,enemies:[],allies:[]};

function ui(){
stage.textContent=S.stage;
gold.textContent=S.gold;
mana.textContent=S.mana;
hp.textContent=S.hp;
}

function startGame(){
menu.style.display="none";
game.style.display="flex";
spawnLoop=setInterval(spawn,2000);
gameLoop=requestAnimationFrame(loop);
manaLoop=setInterval(()=>{if(S.mana<10){S.mana++;ui();}},1000);
}

function move(v){
S.hero=Math.max(70,Math.min(window.innerWidth-120,S.hero+v));
hero.style.left=S.hero+"px";
}

function attack(){
S.enemies.forEach(e=>{
if(e.x-S.hero<80 && e.x>S.hero)e.hp-=15;
});
}

function summon(){
if(S.mana<3)return;
S.mana-=3;
ui();
const el=document.createElement("div");
el.className="unit ally";
el.textContent="🧙";
battle.appendChild(el);
S.allies.push({el,x:80,hp:50});
}

function spawn(){
const el=document.createElement("div");
el.className="unit enemy";
el.textContent=S.stage%5===0?"🐉":"👹";
battle.appendChild(el);
S.enemies.push({el,x:battle.clientWidth-100,hp:30+S.stage*10});
}

function loop(){
S.allies.forEach(a=>{
a.x+=2;
a.el.style.left=a.x+"px";
S.enemies.forEach(e=>{
if(Math.abs(e.x-a.x)<40)e.hp-=0.5;
});
});

S.enemies=S.enemies.filter(e=>{
e.x-=1+S.stage*0.1;
e.el.style.left=e.x+"px";

if(e.hp<=0){
e.el.remove();
S.gold+=10;
ui();
return false;
}

if(e.x<70){
S.hp-=10;
ui();
e.el.remove();
if(S.hp<=0)end();
return false;
}
return true;
});

if(S.gold>=S.stage*50){
S.stage++;
ui();
}

gameLoop=requestAnimationFrame(loop);
}

function end(){
cancelAnimationFrame(gameLoop);
clearInterval(spawnLoop);
clearInterval(manaLoop);
localStorage.setItem("record",Math.max(+localStorage.getItem("record")||0,S.stage));
game.style.display="none";
gameover.style.display="flex";
final.textContent="Você chegou à fase "+S.stage+
" | Recorde: "+localStorage.getItem("record");
}

ui();
</script>

</body>
</html>
