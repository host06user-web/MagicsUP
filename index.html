<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swamp Attack Clone</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            background: linear-gradient(to bottom, #4a5759, #2f3e46, #354f52);
            display: block;
            border: 4px solid #222;
        }
        .ui-element {
            position: absolute;
            font-weight: bold;
            text-shadow: 2px 2px 0px #000;
            font-size: 20px;
            pointer-events: none;
        }
        #score-board { top: 15px; left: 15px; color: #ffd166; }
        #hp-board { top: 15px; right: 15px; color: #ef476f; }
        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            display: none;
        }
        #game-over-screen h1 { font-size: 48px; color: #ef476f; margin-bottom: 20px; }
        #restart-btn {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            background: #06d6a0;
            color: #fff;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s;
            pointer-events: auto;
        }
        #restart-btn:hover { background: #05b88a; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="score-board" class="ui-element">Pontos: <span id="score">0</span></div>
    <div id="hp-board" class="ui-element">Vida da Cabana: <span id="hp">100</span>%</div>
    
    <div id="game-over-screen">
        <h1>Fim de Jogo!</h1>
        <button id="restart-btn" onclick="resetGame()">Jogar Novamente</button>
    </div>

    <canvas id="gameCanvas" width="800" height="450"></canvas>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Elementos da UI
    const scoreTxt = document.getElementById('score');
    const hpTxt = document.getElementById('hp');
    const gameOverScreen = document.getElementById('game-over-screen');

    // Estado do Jogo
    let gameActive = true;
    let score = 0;
    let spawnTimer = 0;

    // Definição do Defensor (Jogador na Cabana)
    const player = {
        x: 80,
        y: 320,
        width: 40,
        height: 60,
        hp: 100
    };

    // Listas do Jogo
    let bullets = [];
    let enemies = [];

    // Captura o clique do mouse para atirar
    canvas.addEventListener('click', (e) => {
        if (!gameActive) return;

        // Calcular ângulo em direção ao clique
        const rect = canvas.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const angle = Math.atan2(mouseY - (player.y + 20), mouseX - (player.x + 40));

        // Adicionar projétil
        bullets.push({
            x: player.x + 40,
            y: player.y + 20,
            radius: 5,
            speed: 8,
            dx: Math.cos(angle) * 8,
            dy: Math.sin(angle) * 8
        });
    });

    // Função para criar monstros (jacarés/zumbis do pântano)
    function spawnEnemy() {
        const size = 30 + Math.random() * 20;
        enemies.push({
            x: canvas.width + 50,
            y: 340 - (size - 40), // Mantém alinhado ao chão fictício
            width: size * 1.5,
            height: size,
            speed: 1 + Math.random() * 1.5,
            hp: Math.ceil(size / 15)
        });
    }

    // Resetar parâmetros
    function resetGame() {
        score = 0;
        player.hp = 100;
        bullets = [];
        enemies = [];
        gameActive = true;
        scoreTxt.innerText = score;
        hpTxt.innerText = player.hp;
        gameOverScreen.style.display = 'none';
        loop();
    }

    // Loop Principal de Atualização e Desenho
    function loop() {
        if (!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. DESENHAR CENÁRIO (Pântano e Cabana)
        // Água do pântano
        ctx.fillStyle = '#132a13';
        ctx.fillRect(0, 350, canvas.width, 100);
        
        // Cabana (Defesa)
        ctx.fillStyle = '#7f5539';
        ctx.fillRect(0, 200, 100, 150);
        ctx.fillStyle = '#b5828c';
        ctx.fillRect(0, 170, 110, 30); // Teto

        // 2. DESENHAR JOGADOR
        ctx.fillStyle = '#ffb703';
        ctx.fillRect(player.x, player.y, player.width, player.height);
        // Arma do jogador
        ctx.fillStyle = '#333';
        ctx.fillRect(player.x + 30, player.y + 20, 25, 8);

        // 3. ATUALIZAR E DESENHAR BALAS
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            b.x += b.dx;
            b.y += b.dy;

            ctx.fillStyle = '#ffb703';
            ctx.beginPath();
            ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
            ctx.fill();

            // Remover se sair da tela
            if (b.x > canvas.width || b.y > canvas.height || b.x < 0 || b.y < 0) {
                bullets.splice(i, 1);
            }
        }

        // 4. ATUALIZAR E DESENHAR INIMIGOS
        spawnTimer++;
        if (spawnTimer > 90) { // Gera inimigo a cada ~1.5 segundos
            spawnEnemy();
            spawnTimer = 0;
        }

        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            e.x -= e.speed;

            // Desenha o monstro (Jacaré simplificado)
            ctx.fillStyle = '#52b788';
            ctx.fillRect(e.x, e.y, e.width, e.height);
            
            // Olho do monstro
            ctx.fillStyle = '#fff';
            ctx.fillRect(e.x + 10, e.y + 5, 5, 5);

            // Colisão com a Cabana (X = 100)
            if (e.x <= 100) {
                player.hp -= 10;
                hpTxt.innerText = Math.max(0, player.hp);
                enemies.splice(i, 1);

                if (player.hp <= 0) {
                    gameActive = false;
                    gameOverScreen.style.display = 'flex';
                }
                continue;
            }

            // Colisão com as Balas
            for (let j = bullets.length - 1; j >= 0; j--) {
                let b = bullets[j];
                if (b.x >= e.x && b.x <= e.x + e.width && b.y >= e.y && b.y <= e.y + e.height) {
                    e.hp--;
                    bullets.splice(j, 1);

                    if (e.hp <= 0) {
                        enemies.splice(i, 1);
                        score += 10;
                        scoreTxt.innerText = score;
                    }
                    break;
                }
            }
        }

        requestAnimationFrame(loop);
    }

    // Iniciar o jogo
    loop();
</script>
</body>
</html>
