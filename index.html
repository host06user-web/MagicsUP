<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Cards: Base Defense</title>
    <style>
        /* --- TEXTURAS, CORES E ESTILOS GERAIS (CSS) --- */
        :root {
            --bg-dark: #0d0e12;
            --panel-bg: #1a1c23;
            --primary-neon: #9d4edd;
            --secondary-neon: #3a86ff;
            --enemy-neon: #ff0054;
            --text-color: #e2e8f0;
            --gold: #ffb703;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        /* --- TELA DE ENTRADA (MENU) --- */
        #menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #241442 0%, #0d0e12 100%);
            position: absolute;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .game-title {
            font-size: 4rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-neon), 0 0 30px var(--primary-neon);
            margin-bottom: 50px;
            text-align: center;
        }

        .btn-play {
            padding: 15px 50px;
            font-size: 1.8rem;
            background: transparent;
            color: #fff;
            border: 2px solid var(--secondary-neon);
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px var(--secondary-neon);
            transition: all 0.3s ease;
            text-transform: uppercase;
            font-weight: bold;
        }

        .btn-play:hover {
            background: var(--secondary-neon);
            box-shadow: 0 0 30px var(--secondary-neon), 0 0 60px var(--secondary-neon);
            transform: scale(1.05);
        }

        /* --- TELA DE JOGO --- */
        #game-screen {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            flex-direction: column;
        }

        /* HUD Superior */
        #hud {
            height: 60px;
            background: var(--panel-bg);
            border-bottom: 2px solid #2d313f;
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 0 20px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .hud-item span { color: var(--gold); }
        .hud-hp span { color: var(--enemy-neon); }

        /* Campo de Batalha (2D Side-Scroller) */
        #battlefield {
            flex: 1;
            background: linear-gradient(to bottom, #13151f 0%, #1c1e29 70%, #11131c 100%);
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid #2d313f;
        }

        /* Linhas e Bases de Luta */
        .base {
            position: absolute;
            bottom: 40px;
            width: 100px;
            height: 150px;
            border-radius: 10px;
        }

        #player-base {
            left: 20px;
            background: linear-gradient(45deg, #1e293b, var(--secondary-neon));
            box-shadow: -5px 0 20px var(--secondary-neon);
        }

        #enemy-base {
            right: 20px;
            background: linear-gradient(45deg, var(--enemy-neon), #1e293b);
            box-shadow: 5px 0 20px var(--enemy-neon);
        }

        /* Entidades / Sprites do Jogo */
        .entity {
            position: absolute;
            bottom: 40px;
            width: 55px;
            height: 75px;
            border-radius: 6px;
            transition: left 0.1s linear, transform 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.8rem;
            color: #fff;
        }

        #hero {
            background: radial-gradient(circle, #fff 0%, var(--secondary-neon) 100%);
            box-shadow: 0 0 15px var(--secondary-neon);
            border: 2px solid #fff;
            z-index: 5;
            color: #000;
        }

        .ally {
            background: linear-gradient(to top, #48cae4, #0077b6);
            box-shadow: 0 0 10px var(--secondary-neon);
            border: 1px solid #fff;
        }

        .enemy {
            background: linear-gradient(to top, var(--enemy-neon), #9b003a);
            box-shadow: 0 0 12px var(--enemy-neon);
        }

        /* Texturas e Efeitos de Combate Ativos */
        .attacking {
            transform: scale(1.2) skewX(-15deg);
            filter: brightness(1.4);
        }
        .defending {
            border: 4px solid #00f5d4 !important;
            box-shadow: 0 0 35px #00f5d4 !important;
            transform: scale(0.95);
        }

        /* --- DECK DE CARTAS E UPGRADES (PAINEL INFERIOR) --- */
        #bottom-panel {
            height: 220px;
            background: var(--panel-bg);
            display: flex;
            padding: 15px;
            gap: 20px;
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #cards-container {
            flex: 2;
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        /* Cartas Mágicas Estilizadas */
        .card {
            width: 120px;
            height: 165px;
            background: linear-gradient(135deg, #2c3040 0%, #181a24 100%);
            border: 2px solid #4a526d;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .card:hover {
            transform: translateY(-15px);
            border-color: var(--primary-neon);
            box-shadow: 0 10px 25px rgba(157, 78, 221, 0.5);
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: bold;
            text-align: center;
            color: #fff;
        }

        .card-desc {
            font-size: 0.7rem;
            color: #a0aec0;
            text-align: center;
        }

        .card-cost {
            background: #3d435a;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 0.75rem;
            color: #00f5d4;
            font-weight: bold;
        }

        /* Controles do Herói Principal e Upgrades */
        #controls-upgrade {
            flex: 1.5;
            border-left: 2px solid #2d313f;
            padding-left: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group h3 {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 4px;
            border-bottom: 1px solid #2d313f;
            padding-bottom: 2px;
        }

        .btn-action {
            background: #2d313f;
            color: #fff;
            border: none;
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-action:hover { background: #41475c; }
        .btn-action:active { transform: scale(0.96); }

        .btn-upgrade {
            background: linear-gradient(45deg, #7b2cbf, var(--primary-neon));
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            transition: filter 0.2s;
        }

        .btn-upgrade:hover {
            filter: brightness(1.2);
        }

        /* Responsividade para telas compactas */
        @media (max-width: 850px) {
            #bottom-panel { flex-direction: column; height: auto; overflow-y: auto;}
            #controls-upgrade { border-left: none; padding-left: 0; margin-top: 15px;}
        }
    </style>
</head>
<body>

    <!-- INTERFACE 1: TELA DE ENTRADA -->
    <div id="menu-screen">
        <h1 class="game-title">Magic Cards<br><span style="font-size: 2rem; color: var(--secondary-neon);">Base Defense</span></h1>
        <button class="btn-play" onclick="startGame()">Play</button>
    </div>

    <!-- INTERFACE 2: DEFENDA A BASE -->
    <div id="game-screen">
        <!-- HUD Principal do Topo -->
        <div id="hud">
            <div class="hud-item" id="hud-stage">Fase: <span>1</span></div>
            <div class="hud-item" id="hud-gold">Ouro: <span>0</span></div>
            <div class="hud-item" id="hud-mana">Mana: <span>10/10</span></div>
            <div class="hud-item hud-hp" id="hud-base-hp">Vida da Base: <span>100</span></div>
        </div>

        <!-- Campo de Luta 2D -->
        <div id="battlefield">
            <div id="player-base" class="base"></div>
            <div id="enemy-base" class="base"></div>
            
            <!-- Herói que o jogador controla diretamente -->
