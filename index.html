<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Fight Co-Op Horda</title>
    <style>
        * { box-sizing: border-box; margin:0; padding:0; user-select:none; -webkit-user-select:none; }
        body { background:#05050a; color:#fff; font-family:monospace; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; }
        #gameContainer { position:relative; width:100%; max-width:800px; aspect-ratio:16/9; background:#000; border:3px solid #00f0ff; box-shadow:0 0 15px #00f0ff; border-radius:8px; }
        canvas { width:100%; height:100%; display:block; }
        .hud { position:absolute; top:12px; left:0; width:100%; display:flex; justify-content:space-between; align-items:center; padding:0 20px; font-weight:bold; font-size:16px; }
        .bar-bg { width:30%; background:rgba(255,255,255,0.1); height:16px; border:2px solid #fff; border-radius:4px; overflow:hidden; }
        .bar { height:100%; width:100%; transition:width 0.1s; background:linear-gradient(90deg, #ff0055, #ff5500); }
        #p2H { background:linear-gradient(270deg, #00ff66, #00ffff); }
        #waveInfo { background:#111; padding:2px 8px; border:2px solid #ffaa00; border-radius:6px; color:#ffaa00; font-size:16px; text-align:center; }
        #over { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); flex-direction:column; align-items:center; justify-content:center; z-index:10; }
        #winTxt { font-size:32px; font-weight:bold; margin-bottom:8px; }
        #ctrls { position:absolute; bottom:0; left:0; width:100%; height:110px; display:flex; justify-content:space-between; padding:10px 20px; pointer-events:none; }
        .pad { display:flex; gap:10px; pointer-events:auto; align-items:center; }
        .btn { width:48px; height:48px; background:rgba(26,26,51,0.8); border:2px solid #336; border-radius:50%; color:#00f0ff; font-size:18px; display:flex; align-items:center; justify-content:center; }
        .btn:active { background:#336; color:#fff; }
        .atk-b { width:52px; height:52px; border-radius:8px; font-size:20px; border-color:#ff0055; color:#ff0055; }
    </style>
</head>
<body>
<div id="gameContainer">
    <div class="hud">
        <div class="bar-bg"><div id="p1H" class="bar"></div></div>
        <div id="waveInfo">HORDA 1<br><span id="enemyCount">Bots: 2</span></div>
        <div class="bar-bg"><div id="p2H" class="bar"></div></div>
    </div>
    <div id="over"><div id="winTxt"></div><div id="subTxt" style="color:#888">Iniciando...</div></div>
    <canvas id="gameCanvas"></canvas>
    <div id="ctrls">
        <div class="pad">
            <div class="btn" id="p1L">◀</div>
            <div class="btn" id="p1R">▶</div>
            <div class="btn" id="p1J">▲</div>
            <div class="btn atk-b" id="p1A">👊</div>
        </div>
        <div class="pad">
            <div class="btn atk-b" id="p2A">👊</div>
            <div class="btn" id="p2J">▲</div>
            <div class="btn" id="p2L">◀</div>
            <div class="btn" id="p2R">▶</div>
        </div>
    </div>
</div>
<script>
const canvas = document.getElementById('gameCanvas'); const ctx = canvas.getContext('2d');
canvas.width = 1024; canvas.height = 576; const gravity = 0.6; let gameActive = true;
let horda = 1; let audioCtx = null; let synthInterval = null;

// Motor de Áudio Procedural (Sons via Matemática)
function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // Loop de Música Sintetizada Retro Cyberpunk
    let notes =; let step = 0;
    synthInterval = setInterval(() => {
        if (!gameActive) return;
        let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.2); step++;
    }, 250);
}
function playSound(type) {
    if (!audioCtx) return;
    let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    if (type === 'hit') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(120, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1); gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    } else if (type === 'jump') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.15); gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    } else if (type === 'atk') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.08); gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    }
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15);
}

class Fighter {
    constructor({ x, color, ox, id, isBot = false }) {
        this.pos = { x, y: 0 }; this.vel = { x: 0, y: 0 }; this.w = 60; this.h = 140; this.color = color;
        this.id = id; this.isBot = isBot; this.isAtk = false; this.hp = 100; this.state = 'idle';
        this.facing = id === 1 ? 'right' : 'left'; this.stTimer = 0; this.atkBox = { pos: { x: 0, y: 0 }, ox, w: 90, h: 45 };
    }
    draw() {
        ctx.save(); ctx.shadowBlur = 10; ctx.shadowColor = this.color;
        let g = ctx.createLinearGradient(this.pos.x, this.pos.y, this.pos.x, this.pos.y + this.h);
        g.addColorStop(0, this.color); g.addColorStop(1, '#000'); ctx.fillStyle = g;
        ctx.beginPath(); ctx.roundRect(this.pos.x, this.pos.y, this.w, this.h, 6); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff'; ctx.font = 'bold 15px monospace';
        let fx = this.pos.x + (this.facing === 'right' ? 14 : 10), fy = this.pos.y + 30;
        let face = "•_•"; if (this.state === 'hit') face = "✕_✕"; else if (this.state === 'atk') face = "🪓_🪓";
        ctx.fillText(face, fx, fy);
        if (this.isAtk) { ctx.fillStyle = 'rgba(255,255,0,0.2)'; ctx.fillRect(this.atkBox.pos.x, this.atkBox.pos.y, this.atkBox.w, this.atkBox.h); }
        ctx.restore();
    }
    update() {
        this.draw(); this.atkBox.pos.x = this.facing === 'right' ? this.pos.x + this.atkBox.ox : this.pos.x - this.atkBox.w + 10;
        this.atkBox.pos.y = this.pos.y + 25; if (this.stTimer > 0) { this.stTimer--; if (this.stTimer === 0) this.state = 'idle'; }
        this.pos.x += this.vel.x; this.pos.y += this.vel.y;
        if (this.pos.y + this.h + this.vel.y >= canvas.height - 85) { this.vel.y = 0; this.pos.y = canvas.height - 85 - this.h; } else { this.vel.y += gravity; }
        this.pos.x = Math.max(0, Math.min(canvas.width - this.w, this.pos.x));
    }
    attack() {
        if (this.isAtk || this.state === 'hit') return;
        this.state = 'atk'; this.isAtk = true; this.stTimer = 12; playSound('atk');
        setTimeout(() => { this.isAtk = false; }, 120);
    }
    damage(amt) { this.hp = Math.max(0, this.hp - amt); this.state = 'hit'; this.stTimer = 14; playSound('hit'); }
}

const p1 = new Fighter({ x: 200, color: '#ff0055', ox: 50, id: 1 });
const p2 = new Fighter({ x: 320, color: '#00ff66', ox: 50, id: 2 });
let enemies = []; const input = { p1L: false, p1R: false, p2L: false, p2R: false };

function spawnHorda() {
    enemies = []; let count = horda + 1;
    for (let i = 0; i < count; i++) {
        enemies.push(new Fighter({ x: 700 + (i * 60), color: '#888888', ox: 50, id: 3 + i, isBot: true }));
    }
    document.getElementById('waveInfo').innerHTML = `HORDA ${horda}<br><span id="enemyCount">Bots: ${enemies.length}</span>`;
}

function bind(id, s, e) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (x) => { x.preventDefault(); initAudio(); s(); });
    el.addEventListener('touchend', (x) => { x.preventDefault(); e(); });
    el.addEventListener('mousedown', () => { initAudio(); s(); }); el.addEventListener('mouseup', e);
}
bind('p1L', () => input.p1L = true, () => input.p1L = false); bind('p1R', () => input.p1R = true, () => input.p1R = false);
bind('p1J', () => { if (p1.vel.y === 0 && gameActive && p1.hp > 0) { p1.vel.y = -14; playSound('jump'); } }, () => {});
bind('p1A', () => { if (gameActive && p1.hp > 0) p1.attack(); }, () => {});
bind('p2L', () => input.p2L = true, () => input.p2L = false); bind('p2R', () => input.p2R = true, () => input.p2R = false);
bind('p2J', () => { if (p2.vel.y === 0 && gameActive && p2.hp > 0) { p2.vel.y = -14; playSound('jump'); } }, () => {});
bind('p2A', () => { if (gameActive && p2.hp > 0) p2.attack(); }, () => {});

function checkCol(r1, r2) {
    return (r1.atkBox.pos.x + r1.atkBox.w >= r2.pos.x && r1.atkBox.pos.x <= r2.pos.x + r2.w && r1.atkBox.pos.y + r1.atkBox.h >= r2.pos.y && r1.atkBox.pos.y <= r2.pos.y + r2.h);
}

function updateBots() {
    enemies.forEach(bot => {
        if (bot.state === 'hit') { bot.vel.x = 0; return; }
        let target = (p1.hp > 0 && (p2.hp <= 0 || Math.abs(p1.pos.x - bot.pos.x) < Math.abs(p2.pos.x - bot.pos.x))) ? p1 : p2;
        if (target.hp <= 0) { bot.vel.x = 0; return; }
        let dx = target.pos.x - bot.pos.x; bot.facing = dx > 0 ? 'right' : 'left';
        if (Math.abs(dx) > 65) { bot.vel.x = dx > 0 ? 2.5 : -2.5; } 
        else { bot.vel.x = 0; if (Math.random() < 0.04) bot.attack(); }
    });
}
function end(win) {
    gameActive = false; clearInterval(synthInterval); 
    const o = document.getElementById('over'), w = document.getElementById('winTxt'), s = document.getElementById('subTxt');
    if (win) { 
        w.innerText = "HORDA LIMPA!"; w.style.color = "#ffaa00"; s.innerText = "Preparando próxima fase..."; horda++; 
        setTimeout(() => { gameActive = true; initAudio(); spawnHorda(); o.style.display = 'none'; }, 2000); 
    } else { 
        w.innerText = "FIM DE JOGO!"; w.style.color = "#ff0055"; s.innerText = "Reiniciando progresso..."; horda = 1; 
        setTimeout(() => window.location.reload(), 3000); 
    }
    o.style.display = 'flex';
}

function loop() {
    window.requestAnimationFrame(loop); ctx.fillStyle = '#05050b'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(0,240,255,0.04)'; ctx.lineWidth = 1;
    for (let i = 0; i < canvas.width; i += 60) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
    ctx.fillStyle = '#0f0f1a'; ctx.fillRect(0, canvas.height - 85, canvas.width, 85);
    ctx.strokeStyle = '#00f0ff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, canvas.height - 85); ctx.lineTo(canvas.width, canvas.height - 85); ctx.stroke();
    
    if (p1.hp > 0) p1.update(); if (p2.hp > 0) p2.update();
    enemies = enemies.filter(b => b.hp > 0); document.getElementById('enemyCount').innerText = `Bots: ${enemies.length}`;
    enemies.forEach(bot => bot.update()); updateBots();
    
    p1.vel.x = p2.vel.x = 0;
    if (gameActive) {
        if (p1.hp > 0 && p1.state !== 'hit') { if (input.p1L) p1.vel.x = -5; else if (input.p1R) p1.vel.x = 5; }
        if (p2.hp > 0 && p2.state !== 'hit') { if (input.p2L) p2.vel.x = -5; else if (input.p2R) p2.vel.x = 5; }
        
        enemies.forEach(bot => {
            if (p1.hp > 0 && p1.isAtk && checkCol(p1, bot)) { bot.damage(15); p1.isAtk = false; }
            if (p2.hp > 0 && p2.isAtk && checkCol(p2, bot)) { bot.damage(15); p2.isAtk = false; }
            if (bot.isAtk) {
                if (p1.hp > 0 && checkCol(bot, p1)) { p1.damage(8); document.getElementById('p1H').style.width = p1.hp + '%'; bot.isAtk = false; }
                if (p2.hp > 0 && checkCol(bot, p2)) { p2.damage(8); document.getElementById('p2H').style.width = p2.hp + '%'; bot.isAtk = false; }
            }
        });
        if (enemies.length === 0) end(true);
        if (p1.hp <= 0 && p2.hp <= 0) end(false);
    }
}
spawnHorda(); loop();
</script>
</body>
</html>
